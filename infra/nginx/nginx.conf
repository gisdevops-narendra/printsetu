worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile     on;
  tcp_nopush   on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml image/svg+xml;

  # Keep in sync with MAX_UPLOAD_SIZE_BYTES in printsetu-backend's env
  # (25 MiB by default) — a little headroom is added for multipart
  # overhead so a max-size document upload isn't rejected at the proxy
  # before it even reaches the backend's own limit check.
  client_max_body_size 30m;

  proxy_connect_timeout 10s;
  proxy_send_timeout    120s;
  proxy_read_timeout    120s;

  # Required for WebSocket proxying: forward the client's Upgrade header
  # verbatim, but only send "Connection: upgrade" when the client actually
  # asked to upgrade (empty Upgrade header -> normal keep-alive request).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream printsetu_backend {
    server backend:3000;
  }

  upstream printsetu_frontend {
    server frontend:80;
  }

  upstream printsetu_minio {
    server minio:9000;
  }

  server {
    listen 80;
    server_name _;

    # ---- NestJS backend API ----
    location /api/ {
      proxy_pass http://printsetu_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Print Agent WebSocket ----
    # socket.io always transports over its default "/socket.io/" HTTP path
    # regardless of the Nest gateway's namespace (the agent connects to
    # "<backendWsUrl>/agent", but that's the socket.io *namespace*, sent in
    # the handshake payload — the actual HTTP path socket.io requests is
    # always /socket.io/). See:
    #   printsetu-print-agent/src/socket-client.ts
    #   printsetu-backend/src/printers/agent-gateway.gateway.ts
    location /socket.io/ {
      proxy_pass http://printsetu_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Agents hold this connection open indefinitely; don't let an idle
      # (but alive, ping/ponged by socket.io every ~25s) socket get reaped.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---- MinIO (S3) — presigned document URLs handed to the browser ----
    # The backend hands the browser presigned MinIO URLs directly for
    # document preview/download (printsetu-backend/src/storage/s3-storage.service.ts),
    # so this path must stay reachable — but MinIO itself has no
    # published port (see docker-compose.prod.yml), only this proxy.
    # The bucket name below must match S3_BUCKET in .env.production
    # (default "printsetu-documents") — MinIO's SigV4 check requires the
    # Host header and request path it sees to exactly match what the
    # backend signed against (S3_ENDPOINT), so nothing here may rewrite
    # the path or override Host; it's forwarded verbatim.
    location /printsetu-documents/ {
      proxy_pass http://printsetu_minio;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Angular frontend (static SPA served by its own container) ----
    location / {
      proxy_pass http://printsetu_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ---- HTTPS ----
  # Once you have a certificate (e.g. via certbot/Let's Encrypt or an
  # uploaded cert), mount it into this container and uncomment below.
  # See infra/README.md "Adding HTTPS" for the full walkthrough.
  #
  # server {
  #   listen 443 ssl;
  #   server_name your-domain.example.com;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #
  #   location /api/ {
  #     proxy_pass http://printsetu_backend;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  #
  #   location /socket.io/ {
  #     proxy_pass http://printsetu_backend;
  #     proxy_http_version 1.1;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection $connection_upgrade;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_read_timeout 3600s;
  #     proxy_send_timeout 3600s;
  #   }
  #
  #   location /printsetu-documents/ {
  #     proxy_pass http://printsetu_minio;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  #
  #   location / {
  #     proxy_pass http://printsetu_frontend;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  # }
  #
  # # Redirect plain HTTP to HTTPS once the above is live:
  # # server {
  # #   listen 80;
  # #   server_name your-domain.example.com;
  # #   return 301 https://$host$request_uri;
  # # }
}
