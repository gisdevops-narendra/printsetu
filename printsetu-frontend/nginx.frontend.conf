server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular router uses HTML5 pushState — unmatched paths fall back to
  # index.html so client-side routing can handle them. index.html itself
  # must never be cached: it's the only thing that references the
  # current build's content-hashed JS/CSS filenames below, so a stale
  # cached copy is exactly what makes a deploy look like "nothing
  # changed" even though the new build shipped fine.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Content-hashed filenames (main.a1b2c3.js etc.) — safe to cache hard,
  # since any real change ships under a new filename, not this one.
  location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
  }
}
