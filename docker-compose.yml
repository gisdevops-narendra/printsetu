name: printsetu

services:
  postgres:
    image: postgres:16-alpine
    container_name: printsetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printsetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printsetu_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-printsetu_db}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - printsetu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printsetu} -d ${POSTGRES_DB:-printsetu_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: printsetu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - printsetu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    container_name: printsetu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-printsetu_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-printsetu_minio_secret}
    ports:
      - "${MINIO_API_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - printsetu_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: printsetu-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-printsetu_minio} ${S3_SECRET_ACCESS_KEY:-printsetu_minio_secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-printsetu-documents} &&
      mc anonymous set none local/${S3_BUCKET:-printsetu-documents} &&
      echo 'MinIO bucket ready (private).'
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: printsetu-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-58080}:8080"
    volumes:
      - ./keycloak/printsetu-realm.json:/opt/keycloak/data/import/printsetu-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Local test inbox: catches every email the backend sends (nothing leaves
  # this machine). Web UI at http://localhost:58025, SMTP on port 51025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: printsetu-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-51025}:1025"
      - "${MAILPIT_UI_PORT:-58025}:8025"

volumes:
  printsetu_postgres_data:
  printsetu_redis_data:
  printsetu_minio_data:
